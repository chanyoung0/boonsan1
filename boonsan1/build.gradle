plugins {
    id 'java'
    id 'application'
}

group = 'com.shindonghwa'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

application {
    mainClass = 'Main'
}

repositories {
    mavenCentral()
}

dependencies {
}